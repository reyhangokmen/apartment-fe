<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Apply the saved appearance before the page paints.
      try {
        const theme =
          localStorage.getItem("kovan-theme") === "dark" ? "dark" : "light";
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
      } catch {}
    </script>
    <link rel="icon" type="image/svg+xml" href="/brand/kovan-icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#CDA65B" />
    <meta
      name="description"
      content="KOVAN Konut ve Site Yönetim Paneli — aidat, daire ve talep yönetimi için interaktif demo."
    />
    <title>KOVAN | Konut & Site Yönetim Paneli</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
