apiVersion: apps/v1
kind: Deployment
metadata:
  name: kovan-fe-deployment
  namespace: default
  labels:
    app: kovan-fe
spec:
  replicas: 2
  selector:
    matchLabels:
      app: kovan-fe
  template:
    metadata:
      labels:
        app: kovan-fe
    spec:
      containers:
      - name: kovan-fe
        image: kovan-fe:latest # Resminizin Docker Registry adresi (örn: registry.example.com/kovan-fe:latest)
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
          name: http
        resources:
          limits:
            cpu: "200m"
            memory: "256Mi"
          requests:
            cpu: "100m"
            memory: "128Mi"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 10
